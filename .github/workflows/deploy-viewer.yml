name: Publish Namma Space
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namma-space-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore exact model exports
        run: python3 scripts/release_assets.py restore
      - name: Verify viewer and saved-view behavior
        run: |
          python3 scripts/check_project.py
          node test/test_view_state.cjs
          python3 -m unittest discover -s test -p 'test_*.py'
      - name: Build public viewer
        run: python3 scripts/package_viewer.py --output output/public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: Verify public viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namma-space-verification
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore exact model exports
        run: python3 scripts/release_assets.py restore
      - name: Verify viewer and saved-view behavior
        run: |
          python3 scripts/check_project.py
          node test/test_view_state.cjs
          python3 -m unittest discover -s test -p 'test_*.py'
      - name: Build public viewer
        run: python3 scripts/package_viewer.py --output output/public
